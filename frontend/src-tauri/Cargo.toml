[package]
name = "ai_photo_intelligence"
version = "0.1.0"
description = "AI Photo Intelligence"
authors = ["AI Photo Intelligence"]
edition = "2021"

[lib]
name = "ai_photo_intelligence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kamadak-exif = "0.6"
image = "0.25"

[dependencies.tauri-plugin-opener]
version = "2"
optional = true

[features]
custom-protocol = ["tauri/custom-protocol"]
